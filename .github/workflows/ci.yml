name: CI/CD Pipeline & Automated MLOps Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  mlops-ci-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          make install

      - name: Run Code Linting (Flake8)
        run: |
          make lint

      - name: Run Training Pipeline & MLflow Tracking
        run: |
          make train

      - name: Execute Automated MLOps Quality Gate & Unit Tests
        run: |
          make test
